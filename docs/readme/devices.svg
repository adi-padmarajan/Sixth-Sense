<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Two devices: the QNX Spidey Sense Pi runs sensors to motors locally; the Eyes and Voice host runs camera, speech and the optional cloud assistant. A link carries proximity alerts from the Spidey Sense Pi to the Eyes and Voice host." font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
