    </g>
    <circle cx="300" cy="300" r="1.6" fill="#fff" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="3s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="30" r="1.6" fill="#fff" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="3s" begin="1.7s" repeatCount="indefinite"/></circle>
  </g>
  <rect x="8" y="8" width="1184" height="334" rx="22" fill="none" stroke="url(#frame)" stroke-width="3"/>
  <text x="90" y="52" font-size="14" font-weight="700" letter-spacing="5" fill="#ff5a5f">DISTANCE → VIBRATION</text><text x="1110" y="52" text-anchor="end" font-family="SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="14" fill="#ffd9a3">pulse rate = 10 × (1 − d / 3500 mm) · 30 % on-time</text>
  <path d="M90.0,100.0 L1110.0,215.0 L90.0,215.0 Z" fill="url(#area)"/><line x1="90.0" y1="100.0" x2="1110.0" y2="215.0" stroke="url(#frame)" stroke-width="3"/><text x="80" y="105.0" text-anchor="end" font-family="SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="12" fill="#aab3c8">10 Hz</text><text x="80" y="220.0" text-anchor="end" font-family="SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="12" fill="#aab3c8">0</text>
  <rect x="92.0" y="229" width="112.6" height="30" rx="6" fill="#ff2d3a" fill-opacity=".9"/><text x="148.3" y="249" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="2" fill="#0b0e1a">URGENT</text>
  <circle cx="148.3" cy="106.6" r="14" fill="none" stroke="#ff2d3a" stroke-opacity=".5"/><circle cx="148.3" cy="106.6" r="8" fill="#ff2d3a" filter="url(#softglow)"><animate attributeName="opacity" values="1;.12" keyTimes="0;.3" calcMode="discrete" dur="0.106s" repeatCount="indefinite"/></circle><text x="148.3" y="84.6" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="12" fill="#ffffff">~9.4 Hz</text>
  <rect x="208.6" y="229" width="112.6" height="30" rx="6" fill="#ff7a1a" fill-opacity=".9"/><text x="264.9" y="249" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="2" fill="#0b0e1a">NEAR</text>
  <circle cx="264.9" cy="119.7" r="14" fill="none" stroke="#ff7a1a" stroke-opacity=".5"/><circle cx="264.9" cy="119.7" r="8" fill="#ff7a1a" filter="url(#softglow)"><animate attributeName="opacity" values="1;.12" keyTimes="0;.3" calcMode="discrete" dur="0.121s" repeatCount="indefinite"/></circle><text x="264.9" y="97.7" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="12" fill="#ffffff">~8.3 Hz</text>
  <rect x="325.1" y="229" width="200.0" height="30" rx="6" fill="#ffc233" fill-opacity=".9"/><text x="425.1" y="249" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="2" fill="#0b0e1a">MID</text>
  <circle cx="425.1" cy="137.8" r="14" fill="none" stroke="#ffc233" stroke-opacity=".5"/><circle cx="425.1" cy="137.8" r="8" fill="#ffc233" filter="url(#softglow)"><animate attributeName="opacity" values="1;.12" keyTimes="0;.3" calcMode="discrete" dur="0.149s" repeatCount="indefinite"/></circle><text x="425.1" y="115.8" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="12" fill="#ffffff">~6.7 Hz</text>
  <rect x="529.1" y="229" width="433.1" height="30" rx="6" fill="#3d7bff" fill-opacity=".9"/><text x="745.7" y="249" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="2" fill="#0b0e1a">FAR</text>
