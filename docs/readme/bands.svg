  <line x1="964.3" y1="263" x2="964.3" y2="271" stroke="#aab3c8"/><text x="964.3" y="287" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="12" fill="#aab3c8">3.0 m</text>
  <line x1="1110.0" y1="263" x2="1110.0" y2="271" stroke="#aab3c8"/><text x="1110.0" y="287" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="12" fill="#aab3c8">3.5 m</text>
  <text x="600" y="324" text-anchor="middle" font-size="15" fill="#aab3c8"><tspan fill="#ffffff" font-weight="700">unknown</tspan> (missing · stale · invalid) → no pulse, reported as a fault, never as “clear”</text>
