  <line x1="323.1" y1="263" x2="323.1" y2="271" stroke="#aab3c8"/><text x="323.1" y="287" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="12" fill="#aab3c8">0.8 m</text>
