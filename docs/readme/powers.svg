  <g text-anchor="middle">
    <text x="220.0" y="204" font-size="19" font-weight="800" letter-spacing="3" fill="#ffffff">FEEL WHERE THINGS ARE</text>
    <text x="220.0" y="236" font-size="15" fill="#aab3c8">Eight sensors, eight motors, 45° apart.</text>
    <text x="220.0" y="261" font-size="15" fill="#aab3c8">Something on your left? Left temple buzzes.</text>
    <text x="220.0" y="286" font-size="15" fill="#aab3c8">Closer means faster pulses.</text>
  </g>
  <rect x="420" y="36" width="360" height="268" rx="18" fill="#0b0e1a" fill-opacity=".72" stroke="#cd7f32" stroke-opacity=".8" stroke-width="1.5"/>
  <g transform="translate(600.0,114)"><path d="M-36,0 Q0,-32 36,0 Q0,32 -36,0 Z" fill="none" stroke="#fff" stroke-width="2"/><circle r="13" fill="#cd7f32"><animate attributeName="cx" values="-8;8;-8" dur="4s" repeatCount="indefinite"/></circle><path d="M-50,-30 h12 M-50,-30 v12 M50,-30 h-12 M50,-30 v12 M-50,30 h12 M-50,30 v-12 M50,30 h-12 M50,30 v-12" stroke="#ffd9a3" stroke-width="2.5" fill="none"/></g>
  <g text-anchor="middle">
    <text x="600.0" y="204" font-size="19" font-weight="800" letter-spacing="3" fill="#ffffff">ASK WHAT IT IS</text>
    <text x="600.0" y="236" font-size="15" fill="#aab3c8">Say “what's in front of me”.</text>
    <text x="600.0" y="261" font-size="15" fill="#aab3c8">Camera + YOLO + assistant answer</text>
    <text x="600.0" y="286" font-size="15" fill="#aab3c8">out loud. Voice in, voice out.</text>
  </g>
  <rect x="800" y="36" width="360" height="268" rx="18" fill="#0b0e1a" fill-opacity=".72" stroke="#2a5bff" stroke-opacity=".8" stroke-width="1.5"/>
