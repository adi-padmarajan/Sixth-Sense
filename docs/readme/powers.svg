  <g text-anchor="middle">
    <text x="980.0" y="204" font-size="19" font-weight="800" letter-spacing="3" fill="#ffffff">NEVER NEEDS THE CLOUD</text>
    <text x="980.0" y="236" font-size="15" fill="#aab3c8">Haptics run on their own QNX Pi:</text>
    <text x="980.0" y="261" font-size="15" fill="#aab3c8">no camera, no cloud, no Wi-Fi, no AI.</text>
    <text x="980.0" y="286" font-size="15" fill="#aab3c8">The tingle keeps tingling.</text>
  </g>
