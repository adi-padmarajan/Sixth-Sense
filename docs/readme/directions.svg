  <text x="738" y="416" font-size="15" font-style="italic" fill="#ffd9a3">Beams don't overlap: this is eight-direction</text>
  <text x="738" y="440" font-size="15" font-style="italic" fill="#ffd9a3">sensing, not continuous 360° coverage.</text>
</svg>
